<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Интерактивный ящер</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    const Input = {
      mouse: { x: canvas.width / 2, y: canvas.height / 2 }
    };

    window.addEventListener("mousemove", (e) => {
      Input.mouse.x = e.clientX;
      Input.mouse.y = e.clientY;
    });

    window.addEventListener("touchmove", (e) => {
      if (e.touches.length > 0) {
        Input.mouse.x = e.touches[0].clientX;
        Input.mouse.y = e.touches[0].clientY;
      }
    });

    class Segment {
      constructor(parent, size, angle, range, stiffness) {
        this.isSegment = true;
        this.parent = parent;
        if (typeof parent.children === "object") {
          parent.children.push(this);
        }
        this.children = [];
        this.size = size;
        this.relAngle = angle;
        this.defAngle = angle;
        this.absAngle = parent.absAngle + angle;
        this.range = range;
        this.stiffness = stiffness;
        this.updateRelative(false, true);
      }

      updateRelative(iter, flex) {
        this.relAngle =
          this.relAngle -
          2 * Math.PI * Math.floor((this.relAngle - this.defAngle) / (2 * Math.PI) + 0.5);
        if (flex) {
          this.relAngle = Math.min(
            this.defAngle + this.range / 2,
            Math.max(
              this.defAngle - this.range / 2,
              (this.relAngle - this.defAngle) / this.stiffness + this.defAngle
            )
          );
        }
        this.absAngle = this.parent.absAngle + this.relAngle;
        this.x = this.parent.x + Math.cos(this.absAngle) * this.size;
        this.y = this.parent.y + Math.sin(this.absAngle) * this.size;
        if (iter) {
          for (let i = 0; i < this.children.length; i++) {
            this.children[i].updateRelative(iter, flex);
          }
        }
      }

      draw(iter) {
        ctx.beginPath();
        ctx.moveTo(this.parent.x, this.parent.y);
        ctx.lineTo(this.x, this.y);
        ctx.stroke();
        if (iter) {
          for (let i = 0; i < this.children.length; i++) {
            this.children[i].draw(true);
          }
        }
      }

      follow(iter) {
        let x = this.parent.x;
        let y = this.parent.y;
        let dist = Math.hypot(this.x - x, this.y - y);
        this.x = x + (this.size * (this.x - x)) / dist;
        this.y = y + (this.size * (this.y - y)) / dist;
        this.absAngle = Math.atan2(this.y - y, this.x - x);
        this.relAngle = this.absAngle - this.parent.absAngle;
        this.updateRelative(false, true);
        if (iter) {
          for (let i = 0; i < this.children.length; i++) {
            this.children[i].follow(true);
          }
        }
      }
    }

    class LimbSystem {
      constructor(end, length, speed, creature) {
        this.end = end;
        this.length = Math.max(1, length);
        this.creature = creature;
        this.speed = speed;
        creature.systems.push(this);
        this.nodes = [];
        let node = end;
        for (let i = 0; i < length; i++) {
          this.nodes.unshift(node);
          node = node.parent;
          if (!node.isSegment) {
            this.length = i + 1;
            break;
          }
        }
        this.hip = this.nodes[0].parent;
      }

      moveTo(x, y) {
        this.nodes[0].updateRelative(true, true);
        let dist = Math.hypot(x - this.end.x, y - this.end.y);
        let len = Math.max(0, dist - this.speed);
        for (let i = this.nodes.length - 1; i >= 0; i--) {
          let node = this.nodes[i];
          let ang = Math.atan2(node.y - y, node.x - x);
          node.x = x + len * Math.cos(ang);
          node.y = y + len * Math.sin(ang);
          x = node.x;
          y = node.y;
          len = node.size;
        }
        for (let i = 0; i < this.nodes.length; i++) {
          let node = this.nodes[i];
          node.absAngle = Math.atan2(node.y - node.parent.y, node.x - node.parent.x);
          node.relAngle = node.absAngle - node.parent.absAngle;
          for (let ii = 0; ii < node.children.length; ii++) {
            let childNode = node.children[ii];
            if (!this.nodes.includes(childNode)) {
              childNode.updateRelative(true, false);
            }
          }
        }
      }

      update() {
        this.moveTo(Input.mouse.x, Input.mouse.y);
      }
    }

    class LegSystem extends LimbSystem {
      constructor(end, length, speed, creature) {
        super(end, length, speed, creature);
        this.goalX = end.x;
        this.goalY = end.y;
        this.step = 0;
        this.forwardness = 0;
        this.reach =
          0.9 *
          Math.hypot(this.end.x - this.hip.x, this.end.y - this.hip.y);
        let relAngle =
          this.creature.absAngle -
          Math.atan2(this.end.y - this.hip.y, this.end.x - this.hip.x);
        relAngle -= 2 * Math.PI * Math.floor(relAngle / (2 * Math.PI) + 0.5);
        this.swing = -relAngle + ((2 * (relAngle < 0) - 1) * Math.PI) / 2;
        this.swingOffset = this.creature.absAngle - this.hip.absAngle;
      }

      update() {
        this.moveTo(this.goalX, this.goalY);
        if (this.step === 0) {
          let dist = Math.hypot(this.end.x - this.goalX, this.end.y - this.goalY);
          if (dist > 1) {
            this.step = 1;
            this.goalX =
              this.hip.x +
              this.reach * Math.cos(this.swing + this.hip.absAngle + this.swingOffset) +
              ((2 * Math.random() - 1) * this.reach) / 2;
            this.goalY =
              this.hip.y +
              this.reach * Math.sin(this.swing + this.hip.absAngle + this.swingOffset) +
              ((2 * Math.random() - 1) * this.reach) / 2;
          }
        } else if (this.step === 1) {
          let theta =
            Math.atan2(this.end.y - this.hip.y, this.end.x - this.hip.x) -
            this.hip.absAngle;
          let dist = Math.hypot(this.end.x - this.hip.x, this.end.y - this.hip.y);
          let forwardness2 = dist * Math.cos(theta);
          let dF = this.forwardness - forwardness2;
          this.forwardness = forwardness2;
          if (dF * dF < 1) {
            this.step = 0;
            this.goalX = this.hip.x + (this.end.x - this.hip.x);
            this.goalY = this.hip.y + (this.end.y - this.hip.y);
          }
        }
      }
    }

    class Creature {
      constructor(x, y, angle, fAccel, fFric, fRes, fThresh, rAccel, rFric, rRes, rThresh) {
        this.x = x;
        this.y = y;
        this.absAngle = angle;
        this.fSpeed = 0;
        this.fAccel = fAccel;
        this.fFric = fFric;
        this.fRes = fRes;
        this.fThresh = fThresh;
        this.rSpeed = 0;
        this.rAccel = rAccel;
        this.rFric = rFric;
        this.rRes = rRes;
        this.rThresh = rThresh;
        this.children = [];
        this.systems = [];
      }

      follow(x, y) {
        let dist = Math.hypot(this.x - x, this.y - y);
        let angle = Math.atan2(y - this.y, x - this.x);
        let accel = this.fAccel;
        if (this.systems.length > 0) {
          let sum = 0;
          for (let i = 0; i < this.systems.length; i++) {
            sum += this.systems[i].step === 0;
          }
          accel *= sum / this.systems.length;
        }
        this.fSpeed += accel * (dist > this.fThresh);
        this.fSpeed *= 1 - this.fRes;
        this.speed = Math.max(0, this.fSpeed - this.fFric);

        let dif = this.absAngle - angle;
        dif -= 2 * Math.PI * Math.floor(dif / (2 * Math.PI) + 0.5);
        if (Math.abs(dif) > this.rThresh && dist > this.fThresh) {
          this.rSpeed -= this.rAccel * (2 * (dif > 0) - 1);
        }
        this.rSpeed *= 1 - this.rRes;
        if (Math.abs(this.rSpeed) > this.rFric) {
          this.rSpeed -= this.rFric * (2 * (this.rSpeed > 0) - 1);
        } else {
          this.rSpeed = 0;
        }

        this.absAngle += this.rSpeed;
        this.absAngle -= 2 * Math.PI * Math.floor(this.absAngle / (2 * Math.PI) + 0.5);
        this.x += this.speed * Math.cos(this.absAngle);
        this.y += this.speed * Math.sin(this.absAngle);

        this.absAngle += Math.PI;
        for (let i = 0; i < this.children.length; i++) {
          this.children[i].follow(true);
        }
        for (let i = 0; i < this.systems.length; i++) {
          this.systems[i].update();
        }
        this.absAngle -= Math.PI;
        this.draw(true);
      }

      draw(iter) {
        let r = 4;
        ctx.beginPath();
        ctx.arc(this.x, this.y, r, Math.PI / 4 + this.absAngle, (7 * Math.PI) / 4 + this.absAngle);
        ctx.moveTo(
          this.x + r * Math.cos((7 * Math.PI) / 4 + this.absAngle),
          this.y + r * Math.sin((7 * Math.PI) / 4 + this.absAngle)
        );
        ctx.lineTo(
          this.x + r * Math.cos(this.absAngle) * Math.SQRT2,
          this.y + r * Math.sin(this.absAngle) * Math.SQRT2
        );
        ctx.lineTo(
          this.x + r * Math.cos(Math.PI / 4 + this.absAngle),
          this.y + r * Math.sin(Math.PI / 4 + this.absAngle)
        );
        ctx.stroke();
        if (iter) {
          for (let i = 0; i < this.children.length; i++) {
            this.children[i].draw(true);
          }
        }
      }
    }
    function setupLizard(size, legs, tail) {
      let s = size;
      let critter = new Creature(
        canvas.width / 2,
        canvas.height / 2,
        0,
        s * 10,
        s * 2,
        0.5,
        16,
        0.5,
        0.085,
        0.5,
        0.3
      );
      let spinal = critter;

      // Шея и голова
      for (let i = 0; i < 6; i++) {
        spinal = new Segment(spinal, s * 4, 0, (Math.PI * 2) / 3, 1.1);
        for (let ii = -1; ii <= 1; ii += 2) {
          let node = new Segment(spinal, s * 3, ii, 0.1, 2);
          for (let iii = 0; iii < 3; iii++) {
            node = new Segment(node, s * 0.1, -ii * 0.1, 0.1, 2);
          }
        }
      }

      // Туловище и лапы
      for (let i = 0; i < legs; i++) {
        if (i > 0) {
          for (let ii = 0; ii < 6; ii++) {
            spinal = new Segment(spinal, s * 4, 0, 1.571, 1.5);
            for (let iii = -1; iii <= 1; iii += 2) {
              let node = new Segment(spinal, s * 3, iii * 1.571, 0.1, 1.5);
              for (let iv = 0; iv < 3; iv++) {
                node = new Segment(node, s * 3, -iii * 0.3, 0.1, 2);
              }
            }
          }
        }
        for (let ii = -1; ii <= 1; ii += 2) {
          let node = new Segment(spinal, s * 12, ii * 0.785, 0, 8);
          node = new Segment(node, s * 16, -ii * 0.785, 6.28, 1);
          node = new Segment(node, s * 16, ii * 1.571, 3.1415, 2);
          for (let iii = 0; iii < 4; iii++) {
            new Segment(node, s * 4, (iii / 3 - 0.5) * 1.571, 0.1, 4);
          }
          new LegSystem(node, 3, s * 12, critter);
        }
      }

      // Хвост
      for (let i = 0; i < tail; i++) {
        spinal = new Segment(spinal, s * 4, 0, (Math.PI * 2) / 3, 1.1);
        for (let ii = -1; ii <= 1; ii += 2) {
          let node = new Segment(spinal, s * 3, ii, 0.1, 2);
          for (let iii = 0; iii < 3; iii++) {
            node = new Segment(
              node,
              (s * 3 * (tail - i)) / tail,
              -ii * 0.1,
              0.1,
              2
            );
          }
        }
      }

      ctx.strokeStyle = "white";
      ctx.lineWidth = 1.5;

      setInterval(() => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        critter.follow(Input.mouse.x, Input.mouse.y);
      }, 33);
    }

    // Запуск ящера
    setupLizard(2.2, 2, 26);
  </script>
</body>
</html>
